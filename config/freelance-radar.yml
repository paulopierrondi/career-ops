version: 1
name: paulo-ai-freelance-radar
default_limit: 8

gates:
  draft_only: true
  no_auto_outreach: true
  no_paid_ads: true
  no_service_now_customer_ecosystem: true
  linkedin_side_business_default: false
  require_human_approval_before_send: true
  require_lgpd_consent_for_marketing: true

execution_policy:
  freelance_speed_first:
    strategy: fastest_safe_first_slice
    intent: use Paulo's internal AI/tool advantage to reply, scope, demo and deliver faster than marketplace competitors while presenting a professional outcome-first client experience
    client_facing_positioning:
      principle: clients buy outcomes, confidence, speed and price; they do not need to hear about Paulo's internal LLM stack
      allowed_language:
        - processo enxuto
        - primeira entrega visivel
        - escopo fechado
        - documentacao e handoff
        - teste com exemplos reais ou dados de teste
        - automacao or IA only when it is part of the actual client deliverable
      avoid_language:
        - many LLMs
        - multi-LLM
        - internal agents
        - prompt stack
        - which model wrote the proposal
        - cheap because AI does the work
    default_response_sla:
      hot_client_reply_minutes: 5
      proposal_draft_minutes: 10
      top_opportunity_review_minutes: 15
      first_visible_value_target: 24-48h when scope allows
    internal_acceleration_lanes:
      - scout: summarize brief, buyer pain, price signal, hidden risks and competitor angle
      - proposal: draft concise platform-native proposal in the buyer's language
      - technical: produce first-slice checklist, acceptance criteria and delivery plan
      - proof: create demo artifact, screenshot, JSON sample, fake-data dashboard or diagram when useful
      - qa: check scope boundaries, security, platform rules, LGPD/WhatsApp risk and handoff
    rules:
      - Lead with speed and a visible first result, not a broad architecture essay.
      - Use internal AI/tool lanes to compress research, drafting, implementation prep and QA.
      - Do not expose internal LLM/tooling details in client proposals; translate them into speed, clarity, proof and reliability.
      - Submit/send only through one coordinator after Paulo approval where the platform action requires it.
      - Never use speed to spam, bypass platform rules, move off-platform, skip security, or promise unsafe automation.
      - Default to proof-first offers: demo, first fix, first flow, first dashboard, first integration, first page or first clickable slice.

pricing_policy:
  99freelas:
    strategy: lowest_defensible_fast_entry_price
    intent: win first deals, replies and reviews before maximizing ticket by being cheaper and faster on a smaller first slice
    quote_shape: paid speed microphase first, upsell implementation/retainer after trust
    target_position: below visible average and, when competitor prices are visible, at or below the lowest credible competing offer
    rules:
      - Never quote the full desired build when the buyer is price sensitive; quote the fastest useful first phase.
      - Prefer a same-day/24-48h visible artifact when scope allows.
      - Use aggressive price only by shrinking scope, timeline and deliverables, not by removing tests, docs, security boundaries or handoff.
      - If scope is vague, sell diagnostic/blueprint/first fix instead of full implementation.
      - If the project has many proposals, price closer to the minimum band and make the first two proposal lines prove fit.
      - If the project is high-fit and low-competition, still undercut the visible average, but preserve a clear phase-2 upsell.
      - Do not use paid promotion/boost unless Paulo explicitly approves at action time.
    entry_bands_brl:
      tiny_fix_or_validation_same_day: "R$180-R$300"
      quick_fix_or_connection_24_48h: "R$250-R$400"
      landing_or_copy_microphase_24_72h: "R$300-R$550"
      diagnostic_blueprint_24_48h: "R$350-R$650"
      crm_bi_powerbi_first_fix_2_3_days: "R$450-R$800"
      whatsapp_n8n_api_stabilization_2_4_days: "R$550-R$900"
      ai_agent_or_streamlit_mvp_slice_3_5_days: "R$650-R$1100"
      lovable_no_code_member_area_slice_3_7_days: "R$900-R$1800"
      saas_or_marketplace_phase_1_5_10_days: "R$1200-R$2500"
      large_platform_only_if_phase_1_is_credible: "R$2500-R$5000"
    floor_guardrails:
      - Do not price below the effort needed for a usable deliverable.
      - Do not accept production access, secrets, policy-risky automation or unlimited revisions inside a microphase.
      - Do not hide that phase 2 will be separately priced.

